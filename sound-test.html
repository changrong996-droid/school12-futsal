<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>声音试听 · 第12学校五人制足球</title>
<style>
:root{--ink:#1a1423;--paper:#f6f2ea;--card:#fffdf8;--muted:#6b6577;--line:#ddd5c6;--accent:#c0213a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:22px 18px 40px}
.kicker{font:700 12px/1 inherit;letter-spacing:.2em;color:var(--accent)}
h1{font-size:clamp(24px,4vw,36px);margin:8px 0 6px}
.dek{color:var(--muted);margin:0 0 16px;max-width:64ch}
.bar{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--paper);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
.btn{min-height:40px;padding:0 14px;border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:6px;font:inherit;font-size:14px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:default}
.btn.playing{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=range]{width:160px;accent-color:var(--ink)}
.status{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px}
.card h2{font-size:16px;margin:0 0 4px}
.card p{margin:0 0 12px;color:var(--muted);font-size:13px}
.vs{display:flex;gap:8px;flex-wrap:wrap}
.vs .btn{flex:1 1 0;min-width:64px;font-weight:700}
.surf{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.surf .btn{min-height:34px;padding:0 10px;font-size:13px}
.pick{display:flex;gap:6px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.pick .btn{min-height:32px;padding:0 10px;font-size:13px}
.pick .btn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.submit{margin-top:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.surf .btn[aria-pressed=true]{background:var(--ink);color:var(--paper)}
footer{margin-top:24px;color:var(--muted);font-size:12px}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">声音试听</div>
  <h1>第12学校五人制足球 · 盲听</h1>
  <p class="dek">每一类声音有 2–3 个版本，标为 A、B、C。请只凭耳朵挑你觉得最自然、最像真实校园比赛的那一个。版本顺序是随机排的，字母不代表好坏。</p>
  <div class="bar">
    <button class="btn primary" id="startBtn">开启声音</button>
    <button class="btn" id="stopBtn" disabled>全部停止</button>
    <label class="status">音量 <input type="range" id="vol" min="0" max="100" value="70" aria-label="音量"></label>
    <span class="status" id="status">需要先点“开启声音”。</span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="submit"><button class="btn primary" id="sendBtn">提交我的选择</button><span class="status" id="pickStatus">每类点“我选”下面的字母，选好后提交。会打开一个预填好的 GitHub Issue，点“Create”即可。</span></div>
  <footer>回到 <a href="./">比赛页面</a>。部分版本使用 Freesound 上的 CC0（公共领域）录音，出处见 README。</footer>
</div>
<script>
